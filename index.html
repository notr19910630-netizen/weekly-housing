  const og={};other.forEach(x=>(og[x.r]??=[]).push(x));const or=document.querySelector('#otherRows');or.innerHTML='';order.filter(r=>og[r]?.length).forEach(r=>{const arr=og[r];or.insertAdjacentHTML('beforeend',`<div class="or"><div class="ort"><h3>${esc(labels[r]||r)}</h3><span>${arr.length} 筆</span></div><div class="og">${arr.map(x=>`<article class="oc"><div class="on"><b>${esc(x.c)}</b><small>${esc(x.x)} · ${esc(x.date)} · ${esc(x.name)}</small></div><div class="ov"><strong>${n(x.price)} 萬</strong><small>${f(x.area)} 坪 · ${esc(x.floor)}樓</small></div><div class="ns">${esc(x.reason||'目前未找到可確認的同社區售屋資訊')}</div></article>`).join('')}</div></div>`);});
  document.querySelector('#footer').innerHTML=`<strong>${esc(D.period)} 市場資料整理</strong><br>頁面版本：2026/09/01 12:19 · 嚴格售屋資訊檢查 ${CHECKED_AT}<br>硬性規則：沒有完整售屋資訊就沒有連結。非單一物件頁，或缺物件名稱、售價、建物坪數、樓層、聯絡／預約資訊任一項，一律不渲染到客戶版。`;
}).catch(e=>{document.querySelector('#note').innerHTML='<div class="error">本週資料載入失敗，請稍後重新整理。</div>';console.error(e)});
