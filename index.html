d,i)=>document.querySelector('#'+id).textContent=[D.transactions,D.active_transactions,D.other_transactions,D.links][i]);document.querySelector('#note').innerHTML=`本週 <strong>${D.transactions} 筆有效成交已完整收錄</strong>；網頁只使用最終 QA 表中 <strong>validation_status = PASS</strong> 的房源，共 <strong>${D.links} 個有效物件連結</strong>。<span class="verify">✓ 最終驗證 ${VERIFIED_AT}</span> 未通過或無法確認在售的網址不會出現在商品卡。`;const all=[...D.active,...D.other],RC={},AC={};all.forEach(x=>RC[x.r]=(RC[x.r]||0)+1);D.active.forEach(x=>AC[x.r]=(AC[x.r]||0)+1);document.querySelector('#nav').innerHTML=order.filter(r=>RC[r]).map(r=>`<a href="#r-${esc(r)}">${esc(labels[r]||r)} <b>${RC[r]}</b><small>${AC[r]||0} 有在售</small></a>`).join('')+`<a href="#other">其他成交 <b>${D.other_transactions}</b></a>`;const groups={};D.active.forEach(x=>(groups[x.r]??=[]).push(x));const ac=document.querySelector('#active');order.filter(r=>groups[r]?.length).forEach(r=>{const arr=groups[r];ac.insertAdjacentHTML('beforeend',`<section id="r-${esc(r)}"><div class="rtitle"><h2>${esc(labels[r]||r)}</h2><span>${RC[r]} 筆成交 · ${arr.length} 筆有在售</span></div><div class="grid">${arr.map(x=>`<article class="community"><div class="head"><div><div class="tags"><span>${esc(labels[x.r]||x.r)}</span><span>${esc(x.x)}</span></div><h3>${esc(x.c)}</h3></div><div class="pill">本週成交</div></div><div class="dealname">${esc(x.name)}</div><div class="addr">${esc(x.a)}</div><div class="deal"><div class="main"><small>成交總價</small><strong>${n(x.price)} 萬</strong></div><div><small>建物</small><b>${f(x.area)} 坪</b></div><div><small>樓層</small><b>${esc(x.floor)}樓</b></div><div><small>日期</small><b>${esc(x.date)}</b></div></div><div class="shelf"><strong>● 同社區在售商品櫃</strong><small>${x.ls.length} 筆 QA PASS</small></div><div class="rail">${x.ls.map((l,i)=>{const img=imgFor(l);return `<article class="card"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><div class="photo ${img?'hasimg':''}">${img?`<img src="${esc(img)}" alt="${esc(x.c)}在售物件" loading="lazy" referrerpoli
